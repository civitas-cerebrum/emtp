name: EMTP Pipeline
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep CLI
        run: pip install semgrep

      - name: Run Semgrep SAST and Secrets Scanning
        run: semgrep scan --sarif --sarif-output=semgrep.sarif

      - name: Upload Semgrep scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep.sarif'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest

      - name: Generate minimal config.ini for tests
        run: |
          cat > config.ini << 'EOF'
          [DEFAULT]
          model_expertise = Quality Assurance
          debug_logs = False
          request_timeout = 60
          owui_base_url = http://localhost:8080/
          ollama_uri = api/generate
          model_name = gemma3:4b
          authorization_token = test-token
          dataset_prompt = Generate Q&A about {domain_of_expertise}
          q_gen_prompt = Generate questions about {topic}
          q_categorisation_prompt = Categorise this question
          deep_dive_prompt = Generate follow-up questions about {domain_of_expertise}
          conversation_prompt = Convert Q&A pairs about {domain_of_expertise} into a conversation
          firecrawl_url = http://localhost:3002
          search_result_count = 10
          conversation_batch_size = 8
          min_content_length = 200
          max_content_length = 0
          EOF

      - name: Run tests
        run: python -m pytest tests/ -v
